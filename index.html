<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossa Lista de Desejos</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-800 min-h-screen pb-24 font-sans selection:bg-indigo-100 selection:text-indigo-900">

  <!-- URL DO GOOGLE APPS SCRIPT -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfYhfTtN8pVtSy9IJU4A3yIkVoa2bBeIHWuMyCNs86RhNxyf6OEP1D5-rChUdC7w/exec";
  </script>

  <!-- TELA DE BLOQUEIO -->
  <div id="telaBloqueio" class="fixed inset-0 bg-zinc-950 z-[70] flex items-center justify-center p-4">
    <div class="bg-white rounded-[24px] p-8 w-full max-w-xs shadow-2xl space-y-6 text-center">
      <div class="bg-indigo-50 text-indigo-600 w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-2">
        <i data-lucide="lock" class="w-7 h-7"></i>
      </div>
      <div>
        <h3 class="font-bold text-zinc-900 text-xl tracking-tight">Nossos Sonhos</h3>
        <p class="text-sm text-zinc-500 mt-1">Insira o PIN para acessar</p>
      </div>
      <input type="password" id="inputPinRaiz" maxlength="4" class="w-full text-center text-3xl font-black tracking-[0.5em] bg-zinc-50 border border-zinc-200 rounded-2xl py-4 focus:outline-none focus:ring-2 focus:ring-indigo-600 transition-all text-zinc-800" placeholder="••••">
      <button onclick="desbloquearRaiz()" class="w-full py-4 bg-indigo-600 text-white font-bold text-sm rounded-2xl shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 active:scale-95 transition-all">Acessar Lista</button>
    </div>
  </div>

  <!-- CABEÇALHO FIXO -->
  <div class="sticky top-0 z-40 bg-zinc-50/85 backdrop-blur-xl border-b border-zinc-200/80 shadow-sm">
    <div class="px-5 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="gift" class="w-5 h-5 text-indigo-600"></i>
        <h1 class="font-bold text-xl tracking-tight text-zinc-900">Wishlist</h1>
      </div>
      
      <div class="flex items-center gap-4">
        <!-- Botões agora abrem Modais -->
        <button onclick="abrirModalFiltros()" class="relative text-zinc-400 hover:text-indigo-600 transition-colors">
          <i data-lucide="filter" class="w-5 h-5"></i>
          <span id="badgeFiltros" class="hidden absolute -top-1 -right-1 w-2 h-2 bg-indigo-600 rounded-full border border-white"></span>
        </button>
        <button onclick="abrirModalOrdenacao()" class="text-zinc-400 hover:text-indigo-600 transition-colors">
          <i data-lucide="arrow-up-down" class="w-5 h-5"></i>
        </button>
        <div class="w-px h-5 bg-zinc-200 mx-1"></div>
        <button onclick="sairDoPainel()" class="text-zinc-400 hover:text-red-500 transition-colors">
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Resumo Financeiro -->
    <div class="px-5 pb-4">
      <div class="bg-white rounded-2xl p-3 border border-zinc-200/80 shadow-sm flex justify-between items-center text-center">
        <div class="flex-1">
          <span class="block text-[9px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">A Comprar</span>
          <span id="totalPendente" class="text-xs font-bold text-zinc-800">R$ 0</span>
        </div>
        <div class="w-px h-8 bg-zinc-100"></div>
        <div class="flex-1">
          <span class="block text-[9px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">Gasto</span>
          <span id="totalRealizado" class="text-xs font-bold text-indigo-600">R$ 0</span>
        </div>
        <div class="w-px h-8 bg-zinc-100"></div>
        <div class="flex-1">
          <span class="block text-[9px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">Economia</span>
          <span id="totalEconomia" class="text-xs font-bold text-emerald-500">R$ 0</span>
        </div>
      </div>
    </div>
  </div>

  <main class="max-w-xl mx-auto p-5 pt-6">
    <div id="listaDesejos" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Injetado via JS -->
    </div>
  </main>

  <button onclick="abrirModalDesejo()" class="fixed bottom-6 right-6 bg-indigo-600 text-white p-4 rounded-full shadow-xl shadow-indigo-600/30 hover:bg-indigo-700 active:scale-90 transition-all z-30 flex items-center justify-center">
    <i data-lucide="plus" class="w-6 h-6"></i>
  </button>

  <!-- MODAL DE FILTROS -->
  <div id="modalFiltros" class="fixed inset-0 bg-zinc-950/40 backdrop-blur-sm hidden z-50 overflow-y-auto">
    <div class="min-h-screen px-4 text-center flex items-end sm:items-center justify-center py-6">
      <div class="bg-white rounded-[24px] p-6 w-full max-w-sm shadow-2xl text-left relative transform transition-all">
        <div class="flex justify-between items-center mb-6">
          <div class="flex items-center gap-3">
            <div class="bg-indigo-50 text-indigo-600 p-2.5 rounded-xl">
              <i data-lucide="filter" class="w-5 h-5"></i>
            </div>
            <h3 class="font-bold text-zinc-900 text-xl tracking-tight">Filtros</h3>
          </div>
          <button onclick="fecharModalFiltros()" class="text-zinc-400 hover:text-zinc-700 p-1 transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        
        <div class="space-y-4">
          <div>
            <label class="text-[10px] font-bold text-zinc-400 uppercase mb-1.5 block">Status</label>
            <select id="filtroStatus" class="w-full bg-zinc-50 text-zinc-700 text-sm font-semibold rounded-xl p-3.5 border border-zinc-200/80 outline-none focus:ring-2 focus:ring-indigo-600 transition">
              <option value="Todos">Todos</option>
              <option value="Pendente">Pendentes</option>
              <option value="Comprado">Comprados</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] font-bold text-zinc-400 uppercase mb-1.5 block">Categoria</label>
            <select id="filtroCategoria" class="w-full bg-zinc-50 text-zinc-700 text-sm font-semibold rounded-xl p-3.5 border border-zinc-200/80 outline-none focus:ring-2 focus:ring-indigo-600 transition">
              <option value="Todas">Todas</option>
              <option value="Bebê">Bebê</option>
              <option value="Casa">Casa</option>
              <option value="Eletrônicos">Eletrônicos</option>
              <option value="Viagem">Viagem</option>
              <option value="Carro">Carro</option>
              <option value="Roupas">Roupas</option>
              <option value="Lazer">Lazer</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
        </div>

        <div class="mt-8 flex gap-3">
          <button onclick="limparFiltros()" class="px-5 py-3.5 text-zinc-500 font-bold text-sm hover:bg-zinc-100 rounded-xl transition-colors">Limpar</button>
          <button onclick="aplicarFiltrosEOrdenacao(); fecharModalFiltros()" class="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition-all active:scale-95">Aplicar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL DE ORDENAÇÃO -->
  <div id="modalOrdenacao" class="fixed inset-0 bg-zinc-950/40 backdrop-blur-sm hidden z-50 overflow-y-auto">
    <div class="min-h-screen px-4 text-center flex items-end sm:items-center justify-center py-6">
      <div class="bg-white rounded-[24px] p-6 w-full max-w-sm shadow-2xl text-left relative transform transition-all">
        <div class="flex justify-between items-center mb-6">
          <div class="flex items-center gap-3">
            <div class="bg-indigo-50 text-indigo-600 p-2.5 rounded-xl">
              <i data-lucide="arrow-up-down" class="w-5 h-5"></i>
            </div>
            <h3 class="font-bold text-zinc-900 text-xl tracking-tight">Ordenar Por</h3>
          </div>
          <button onclick="fecharModalOrdenacao()" class="text-zinc-400 hover:text-zinc-700 p-1 transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        
        <div>
          <select id="ordemSelecao" class="w-full bg-zinc-50 text-zinc-700 text-sm font-semibold rounded-xl p-3.5 border border-zinc-200/80 outline-none focus:ring-2 focus:ring-indigo-600 transition">
            <option value="recentes">Adicionados Recentemente</option>
            <option value="antigos">Mais Antigos</option>
            <option value="menorValor">Menor Valor</option>
            <option value="maiorValor">Maior Valor</option>
            <option value="prioridade">Maior Prioridade</option>
            <option value="nome">Ordem Alfabética (A-Z)</option>
          </select>
        </div>

        <div class="mt-8 flex gap-3">
          <button onclick="fecharModalOrdenacao()" class="px-5 py-3.5 text-zinc-500 font-bold text-sm hover:bg-zinc-100 rounded-xl transition-colors">Cancelar</button>
          <button onclick="aplicarFiltrosEOrdenacao(); fecharModalOrdenacao()" class="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition-all active:scale-95">Aplicar Ordem</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL ADICIONAR/EDITAR DESEJO -->
  <div id="modalDesejo" class="fixed inset-0 bg-zinc-950/40 backdrop-blur-sm hidden z-50 overflow-y-auto hide-scrollbar">
    <div class="min-h-screen px-4 text-center flex items-center justify-center py-6">
      <div class="bg-white rounded-[24px] p-6 w-full max-w-md shadow-2xl text-left relative transform transition-all">
        
        <div class="flex justify-between items-center mb-6">
          <h3 id="tituloModal" class="font-bold text-zinc-900 text-xl tracking-tight">Novo Desejo</h3>
          <button id="btnExcluirModal" onclick="excluirDesejoDoModal()" class="hidden text-red-500 hover:bg-red-50 p-2 rounded-xl transition-colors" title="Excluir">
            <i data-lucide="trash-2" class="w-5 h-5"></i>
          </button>
        </div>

        <input type="hidden" id="dsId">

        <div class="space-y-4">
          <div>
            <label class="font-bold text-zinc-500 text-[10px] uppercase tracking-wider mb-1.5 block">O que queremos?</label>
            <input type="text" id="dsItem" placeholder="Ex: Berço, Fraldas..." class="w-full bg-zinc-50 border border-zinc-200/80 rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-indigo-600 focus:bg-white outline-none transition-all" oninput="atualizarPreviewImg()">
          </div>
          
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="font-bold text-zinc-500 text-[10px] uppercase tracking-wider mb-1.5 block">Valor (R$)</label>
              <input type="number" step="0.01" id="dsValor" placeholder="0.00" class="w-full bg-zinc-50 border border-zinc-200/80 rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-indigo-600 focus:bg-white outline-none transition-all">
            </div>
            <div>
              <label class="font-bold text-zinc-500 text-[10px] uppercase tracking-wider mb-1.5 block">Prioridade</label>
              <select id="dsPrioridade" class="w-full bg-zinc-50 border border-zinc-200/80 rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-indigo-600 focus:bg-white outline-none transition-all">
                <option value="Necessidade">Necessidade</option>
                <option value="Desejo" selected>Desejo</option>
                <option value="Sonho">Sonho</option>
              </select>
            </div>
          </div>

          <div>
            <label class="font-bold text-zinc-500 text-[10px] uppercase tracking-wider mb-1.5 block">Categoria</label>
            <select id="dsCategoria" class="w-full bg-zinc-50 border border-zinc-200/80 rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-indigo-600 focus:bg-white outline-none transition-all">
              <option value="Bebê">Bebê</option>
              <option value="Casa">Casa</option>
              <option value="Eletrônicos">Eletrônicos</option>
              <option value="Viagem">Viagem</option>
              <option value="Carro">Carro</option>
              <option value="Roupas">Roupas</option>
              <option value="Lazer">Lazer</option>
              <option value="Outros">Outros</option>
            </select>
          </div>

          <div>
            <label class="font-bold text-zinc-500 text-[10px] uppercase tracking-wider mb-1.5 block">Link da Loja</label>
            <div class="relative">
              <i data-lucide="link" class="w-4 h-4 absolute left-3.5 top-3.5 text-zinc-400"></i>
              <input type="url" id="dsLinkLoja" placeholder="https://..." class="w-full bg-zinc-50 border border-zinc-200/80 rounded-xl p-3.5 pl-10 text-sm focus:ring-2 focus:ring-indigo-600 focus:bg-white outline-none transition-all">
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="font-bold text-zinc-500 text-[10px] uppercase tracking-wider block">Link da Imagem</label>
              <a id="btnBuscaImg" href="#" target="_blank" class="text-[10px] font-bold text-indigo-600 hover:underline">Buscar no Google</a>
            </div>
            <input type="url" id="dsLinkImagem" placeholder="https://..." class="w-full bg-zinc-50 border border-zinc-200/80 rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-indigo-600 focus:bg-white outline-none transition-all" oninput="atualizarPreviewImg()">
            <div id="boxImgPreview" class="hidden mt-3 relative w-full h-36 rounded-xl overflow-hidden border border-zinc-200 bg-zinc-100 shadow-inner">
              <img id="imgPreview" class="w-full h-full object-cover">
            </div>
          </div>

          <div>
            <label class="font-bold text-zinc-500 text-[10px] uppercase tracking-wider mb-1.5 block">Observações</label>
            <textarea id="dsObservacoes" rows="2" placeholder="Por que queremos? Detalhes..." class="w-full bg-zinc-50 border border-zinc-200/80 rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-indigo-600 focus:bg-white outline-none transition-all"></textarea>
          </div>
        </div>

        <div class="flex gap-3 justify-end pt-6 mt-6 border-t border-zinc-100">
          <button onclick="fecharModalDesejo()" class="px-5 py-3 text-zinc-500 font-bold text-sm hover:bg-zinc-100 rounded-xl transition-colors">Cancelar</button>
          <button onclick="salvarDesejo()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/20 transition-all active:scale-95">Salvar Item</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL VALOR PAGO -->
  <div id="modalValorPago" class="fixed inset-0 bg-zinc-950/40 backdrop-blur-sm hidden z-50 overflow-y-auto">
    <div class="min-h-screen px-4 text-center flex items-center justify-center py-6">
      <div class="bg-white rounded-[24px] p-6 w-full max-w-sm shadow-2xl text-left relative transform transition-all">
        
        <div class="flex items-center gap-4 mb-6">
          <div class="bg-emerald-50 text-emerald-600 p-3.5 rounded-2xl">
            <i data-lucide="check-circle" class="w-6 h-6"></i>
          </div>
          <div>
            <h3 class="font-bold text-zinc-900 text-xl tracking-tight">Comprado!</h3>
            <p class="text-sm text-zinc-500">Registre o valor real pago.</p>
          </div>
        </div>
        
        <input type="hidden" id="vpId">
        <input type="hidden" id="vpStatus">
        
        <div class="mb-6">
          <input type="number" step="0.01" id="vpValor" class="w-full text-4xl font-black bg-zinc-50 border border-zinc-200/80 rounded-2xl py-6 text-emerald-600 focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all text-center tracking-tight" placeholder="0.00">
          <p id="vpEstimativa" class="text-[11px] text-zinc-400 text-center mt-3 font-medium uppercase tracking-wider"></p>
        </div>

        <div class="flex gap-3 justify-end">
          <button onclick="fecharModalValorPago()" class="flex-1 py-3.5 text-zinc-600 font-bold text-sm hover:bg-zinc-50 rounded-xl border border-zinc-200 transition-colors">Cancelar</button>
          <button onclick="confirmarStatusComprado()" class="flex-1 py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-500/30 transition-all active:scale-95">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL LOADING -->
  <div id="modalLoading" class="fixed inset-0 bg-zinc-950/50 backdrop-blur-sm hidden z-[80] flex items-center justify-center">
    <div class="bg-white rounded-[24px] p-6 shadow-2xl flex flex-col items-center gap-4 min-w-[160px]">
      <div class="animate-spin rounded-full h-8 w-8 border-4 border-indigo-100 border-t-indigo-600"></div>
      <p id="txtLoading" class="font-bold text-zinc-800 text-sm tracking-tight">Sincronizando...</p>
    </div>
  </div>

  <script>
    let appData = { desejos: [] };
    let userPin = null;

    let filtroStatus = 'Todos';
    let filtroCategoria = 'Todas';
    let ordemAtual = 'recentes';

    window.onload = () => {
      lucide.createIcons();
      const pinSalvo = localStorage.getItem('wishlist_pin');
      if (pinSalvo) {
        userPin = pinSalvo;
        document.getElementById('telaBloqueio').classList.add('hidden');
        carregarDados();
      }
    };

    async function API(payload) {
      if (userPin) payload.pin = userPin;
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function desbloquearRaiz() {
      const pinInput = document.getElementById('inputPinRaiz').value;
      if(pinInput.length < 4) return alert("Digite o PIN completo.");
      
      const res = await API({ action: 'validarPin', pin: pinInput });
      if (res.sucesso) {
        userPin = pinInput;
        localStorage.setItem('wishlist_pin', pinInput);
        document.getElementById('telaBloqueio').classList.add('hidden');
        carregarDados();
      } else {
        alert("PIN Incorreto. Tente novamente.");
        document.getElementById('inputPinRaiz').value = '';
      }
    }

    function sairDoPainel() {
      localStorage.removeItem('wishlist_pin');
      location.reload();
    }

    function mostrarLoading(texto = "Carregando...") {
      document.getElementById('txtLoading').textContent = texto;
      document.getElementById('modalLoading').classList.remove('hidden');
    }

    function esconderLoading() {
      document.getElementById('modalLoading').classList.add('hidden');
    }

    async function carregarDados() {
      mostrarLoading("Puxando desejos...");
      try {
        const res = await API({ action: 'getDados' });
        if (res.sucesso) {
          appData = res;
          renderizarLista();
        }
      } catch (e) {
        alert("Erro de conexão.");
      } finally {
        esconderLoading();
      }
    }

    /* CONTROLE DOS MODAIS DE FILTRO E ORDENAÇÃO */
    function abrirModalFiltros() {
      document.getElementById('modalFiltros').classList.remove('hidden');
    }
    function fecharModalFiltros() {
      document.getElementById('modalFiltros').classList.add('hidden');
    }
    function abrirModalOrdenacao() {
      document.getElementById('modalOrdenacao').classList.remove('hidden');
    }
    function fecharModalOrdenacao() {
      document.getElementById('modalOrdenacao').classList.add('hidden');
    }
    function limparFiltros() {
      document.getElementById('filtroStatus').value = 'Todos';
      document.getElementById('filtroCategoria').value = 'Todas';
      aplicarFiltrosEOrdenacao();
      fecharModalFiltros();
    }

    function aplicarFiltrosEOrdenacao() {
      filtroStatus = document.getElementById('filtroStatus').value;
      filtroCategoria = document.getElementById('filtroCategoria').value;
      ordemAtual = document.getElementById('ordemSelecao').value;

      // Badge visual quando algum filtro estiver ativo
      const badge = document.getElementById('badgeFiltros');
      if (filtroStatus !== 'Todos' || filtroCategoria !== 'Todas') {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      renderizarLista();
    }

    function renderizarLista() {
      const container = document.getElementById('listaDesejos');
      container.innerHTML = '';

      let totalPendentes = 0;
      let totalGastoReal = 0;
      let economiaTotal = 0;

      let listaVisual = appData.desejos.filter(d => {
        if(d.status === "Pendente") {
            totalPendentes += d.valorEstimado;
        }
        if(d.status === "Comprado") {
            const pago = d.valorPago !== undefined ? d.valorPago : 0;
            totalGastoReal += pago;
            economiaTotal += (d.valorEstimado - pago);
        }
        
        const passaStatus = (filtroStatus === 'Todos' || d.status === filtroStatus);
        const passaCategoria = (filtroCategoria === 'Todas' || d.categoria === filtroCategoria);

        return passaStatus && passaCategoria;
      });

      document.getElementById('totalPendente').textContent = `R$ ${totalPendentes.toFixed(2)}`;
      document.getElementById('totalRealizado').textContent = `R$ ${totalGastoReal.toFixed(2)}`;
      
      const elEconomia = document.getElementById('totalEconomia');
      elEconomia.textContent = `R$ ${economiaTotal.toFixed(2)}`;
      elEconomia.className = economiaTotal >= 0 ? "text-xs font-bold text-emerald-500" : "text-xs font-bold text-red-500";

      const prioridadePeso = { 'Necessidade': 3, 'Desejo': 2, 'Sonho': 1 };

      if (ordemAtual === 'recentes') {
        listaVisual.reverse();
      } else if (ordemAtual === 'menorValor') {
        listaVisual.sort((a, b) => (a.valorEstimado || 0) - (b.valorEstimado || 0));
      } else if (ordemAtual === 'maiorValor') {
        listaVisual.sort((a, b) => (b.valorEstimado || 0) - (a.valorEstimado || 0));
      } else if (ordemAtual === 'prioridade') {
        listaVisual.sort((a, b) => (prioridadePeso[b.prioridade] || 0) - (prioridadePeso[a.prioridade] || 0));
      } else if (ordemAtual === 'nome') {
        listaVisual.sort((a, b) => (a.item || '').localeCompare(b.item || ''));
      }

      if (listaVisual.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-16 text-zinc-400 font-medium text-sm">Nenhum item encontrado com os filtros selecionados.</div>`;
        return;
      }

      listaVisual.forEach(d => {
        container.innerHTML += criarCardHtml(d);
      });
      lucide.createIcons();
    }

    function criarCardHtml(d) {
      const isComprado = d.status === "Comprado";
      
      let corPrioridade = "bg-zinc-100 text-zinc-600";
      if(d.prioridade === "Necessidade") corPrioridade = "bg-indigo-100 text-indigo-700 font-extrabold";
      if(d.prioridade === "Desejo") corPrioridade = "bg-sky-100 text-sky-700 font-bold";
      if(d.prioridade === "Sonho") corPrioridade = "bg-fuchsia-100 text-fuchsia-700 font-medium";

      const badgeOpacity = isComprado ? "opacity-60 grayscale" : "";

      return `
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-zinc-200/80 relative flex flex-col ${badgeOpacity} hover:shadow-md transition-all duration-300">
          ${d.linkImagem ? `<img src="${d.linkImagem}" class="w-full h-44 object-cover border-b border-zinc-100" onerror="this.style.display='none'">` : ''}
          
          <div class="p-5 flex-1 flex flex-col">
            <div class="flex justify-between items-start mb-2">
              <span class="text-[10px] uppercase tracking-wider font-bold text-zinc-400">${d.categoria}</span>
              <button onclick='abrirModalDesejo(${JSON.stringify(d).replace(/'/g, "&#39;")})' class="text-zinc-300 hover:text-indigo-600 transition-colors p-1"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
            </div>
            
            <h3 class="font-bold text-zinc-900 text-lg leading-tight mb-3 tracking-tight ${isComprado ? 'line-through text-zinc-500' : ''}">${d.item}</h3>
            
            <div class="flex gap-2 mb-4">
              <span class="text-[10px] px-2.5 py-1 rounded-lg uppercase tracking-wider ${corPrioridade}">${d.prioridade}</span>
            </div>

            <div class="mt-auto pt-4 border-t border-zinc-100 flex items-end justify-between">
              <div>
                <span class="block text-[9px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">Valor Est.</span>
                <span class="font-extrabold text-zinc-800 text-sm">R$ ${d.valorEstimado.toFixed(2)}</span>
              </div>
              <div class="flex gap-2">
                ${d.linkLoja ? `<a href="${d.linkLoja}" target="_blank" class="p-2.5 bg-zinc-50 text-zinc-500 border border-zinc-200/80 rounded-xl hover:bg-zinc-100 hover:text-indigo-600 transition-colors"><i data-lucide="external-link" class="w-4 h-4"></i></a>` : ''}
                <button onclick="iniciarAlteracaoStatus('${d.id}', '${isComprado ? 'Pendente' : 'Comprado'}', ${d.valorEstimado})" class="p-2.5 rounded-xl font-bold text-sm transition-colors flex items-center justify-center ${isComprado ? 'bg-zinc-100 text-zinc-500 hover:bg-zinc-200' : 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100 border border-emerald-100'}" title="${isComprado ? 'Desmarcar' : 'Marcar como Comprado'}">
                  <i data-lucide="${isComprado ? 'x' : 'check'}" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function atualizarPreviewImg() {
      const link = document.getElementById('dsLinkImagem').value;
      const box = document.getElementById('boxImgPreview');
      const img = document.getElementById('imgPreview');
      
      const itemNome = document.getElementById('dsItem').value;
      document.getElementById('btnBuscaImg').href = `https://www.google.com/search?q=${encodeURIComponent(itemNome + " comprar")}&tbm=isch`;

      if(link) {
        img.src = link;
        box.classList.remove('hidden');
      } else {
        box.classList.add('hidden');
      }
    }

    function abrirModalDesejo(d = null) {
      if (d) {
        document.getElementById('tituloModal').textContent = 'Editar Item';
        document.getElementById('btnExcluirModal').classList.remove('hidden');
        document.getElementById('dsId').value = d.id;
        document.getElementById('dsItem').value = d.item;
        document.getElementById('dsValor').value = d.valorEstimado;
        document.getElementById('dsPrioridade').value = d.prioridade;
        document.getElementById('dsCategoria').value = d.categoria;
        document.getElementById('dsLinkLoja').value = d.linkLoja;
        document.getElementById('dsLinkImagem').value = d.linkImagem;
        document.getElementById('dsObservacoes').value = d.observacoes;
      } else {
        document.getElementById('tituloModal').textContent = 'Novo Desejo';
        document.getElementById('btnExcluirModal').classList.add('hidden');
        document.getElementById('dsId').value = '';
        document.getElementById('dsItem').value = '';
        document.getElementById('dsValor').value = '';
        document.getElementById('dsPrioridade').value = 'Desejo';
        document.getElementById('dsCategoria').value = 'Bebê';
        document.getElementById('dsLinkLoja').value = '';
        document.getElementById('dsLinkImagem').value = '';
        document.getElementById('dsObservacoes').value = '';
      }
      atualizarPreviewImg();
      document.getElementById('modalDesejo').classList.remove('hidden');
    }

    function fecharModalDesejo() {
      document.getElementById('modalDesejo').classList.add('hidden');
    }

    async function salvarDesejo() {
      const item = document.getElementById('dsItem').value.trim();
      if(!item) return alert("O nome do item é obrigatório.");

      const desejo = {
        id: document.getElementById('dsId').value,
        item: item,
        valorEstimado: parseFloat(document.getElementById('dsValor').value) || 0,
        prioridade: document.getElementById('dsPrioridade').value,
        categoria: document.getElementById('dsCategoria').value,
        linkLoja: document.getElementById('dsLinkLoja').value,
        linkImagem: document.getElementById('dsLinkImagem').value,
        observacoes: document.getElementById('dsObservacoes').value
      };

      fecharModalDesejo();
      mostrarLoading("Salvando...");
      try {
        const res = await API({ action: 'salvarDesejo', desejo: desejo });
        if(res.sucesso) await carregarDados();
      } finally { esconderLoading(); }
    }

    function iniciarAlteracaoStatus(id, novoStatus, valorEstimado) {
      if (novoStatus === 'Comprado') {
        document.getElementById('vpId').value = id;
        document.getElementById('vpStatus').value = novoStatus;
        document.getElementById('vpValor').value = valorEstimado.toFixed(2);
        document.getElementById('vpEstimativa').textContent = `Estimativa original: R$ ${valorEstimado.toFixed(2)}`;
        
        document.getElementById('modalValorPago').classList.remove('hidden');
        
        setTimeout(() => {
          const input = document.getElementById('vpValor');
          input.focus();
          input.select();
        }, 100);
      } else {
        executarAlteracaoStatus(id, novoStatus, 0);
      }
    }

    function fecharModalValorPago() {
      document.getElementById('modalValorPago').classList.add('hidden');
    }

    function confirmarStatusComprado() {
      const id = document.getElementById('vpId').value;
      const novoStatus = document.getElementById('vpStatus').value;
      const valorTxt = document.getElementById('vpValor').value.replace(',', '.');
      let valorPago = parseFloat(valorTxt);

      if (isNaN(valorPago) || valorTxt.trim() === '') {
        alert("Por favor, insira um valor válido.");
        return;
      }

      fecharModalValorPago();
      executarAlteracaoStatus(id, novoStatus, valorPago);
    }

    async function executarAlteracaoStatus(id, novoStatus, valorPago) {
      mostrarLoading("Atualizando...");
      try {
        const res = await API({ action: 'atualizarStatus', id: id, status: novoStatus, valorPago: valorPago });
        if(res.sucesso) await carregarDados();
      } finally { esconderLoading(); }
    }

    async function excluirDesejoDoModal() {
      const id = document.getElementById('dsId').value;
      if(!confirm("Tem certeza que deseja remover este item da lista?")) return;
      
      fecharModalDesejo();
      mostrarLoading("Excluindo...");
      try {
        const res = await API({ action: 'excluirDesejo', id: id });
        if(res.sucesso) await carregarDados();
      } finally { esconderLoading(); }
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado com sucesso.'))
          .catch(err => console.log('Falha ao registrar o Service Worker:', err));
      });
    }
  </script>
</body>
</html>
